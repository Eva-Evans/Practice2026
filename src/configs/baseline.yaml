defaults:
  - model: baseline
  - metrics: example
  - datasets: asvspoof
  - dataloader: example
  - transforms: example
  - _self_

model:
  _target_: src.model.lcnn.LCNN
  num_classes: 2
optimizer:
  _target_: torch.optim.Adam
  lr: 0.0001
lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.5
  step_size: 5
loss_function:
  _target_: torch.nn.CrossEntropyLoss
trainer:
  log_step: 50
  n_epochs: 50
  epoch_len: null
  device_tensors: ["data_object", "labels"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  override: False # if True, will override the previous run with the same name
  monitor: "off" #"max test_MulticlassAccuracy" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 1 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 43


writer:
  _target_: src.logger.CometMLWriter
  project_name: "anti_spoof"
  run_name: "lcnn_baseline"
  mode: "online"
  #offline: True
  log_checkpoints: True
  workspace: null
  id_length: 32
  run_id: null
  loss_names: ["loss"]
